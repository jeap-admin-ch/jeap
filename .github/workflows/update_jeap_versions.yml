name: Update jEAP versions

on:
  schedule:
    - cron: "0 8,12,16 * * 1-5"
      timezone: "Europe/Zurich"

  workflow_dispatch:
    inputs:
      version_markdown_path:
        description: Path of the generated version markdown file
        required: false
        default: docs/jeap-version-overview.md
        type: string
      force_website_deployment:
        description: Trigger the website deployment even if the version overview did not change
        required: false
        default: false
        type: boolean

concurrency:
  group: update-jeap-versions
  cancel-in-progress: true

# Writes go through tokens of the jeap-workflows GitHub App (see the steps below), so GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  update-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERSION_MARKDOWN_PATH: ${{ inputs.version_markdown_path || 'docs/jeap-version-overview.md' }}
      JEAP_ORG: jeap-admin-ch

      PRODUCT_REPOSITORIES_JSON: >-
        ["jeap-bptest-orchestrator","jeap-deploymentlog-service","jeap-doc-service","jeap-error-handling","jeap-message-contract-service","jeap-message-exchange-service","jeap-oauth-mock-server","jeap-opensearch-index-writer-service","jeap-process-context-service","jeap-process-archive-service","jeap-bptestagent-api","jeap-process-archive-reader","jeap-archrepo-service","jeap-initializer","jeap-reaction-observer-service","jeap-governance-service"]

      SPRING_DEPENDENCIES_JSON: >-
        ["spring-boot","spring-cloud","spring-framework","spring-kafka","spring-security"]

      THIRD_PARTY_DEPENDENCIES_JSON: >-
        ["shedlock","aws.sdk","flyway","hibernate","hikaricp","java","junit-jupiter","lombok","togglz","pact-jvm"]

      REPOSITORIES_BY_COMPONENT_JSON: >-
        {"jeap-config-aws-starter":"jeap-spring-boot-config-aws-starter","jeap-db-migration-starter":"jeap-spring-boot-db-migration-starter","jeap-open-api-publisher":"jeap-open-api-publisher-starter","jeap-opensearch-searchitem":"jeap-opensearch-searchitem-api","jeap-starter":"jeap-spring-boot-starters","jeap-tls-starter":"jeap-spring-boot-tls-starter"}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          target_file="${VERSION_MARKDOWN_PATH}"

          case "$target_file" in
            docs/*.md)
              ;;
            *)
              echo "::error::VERSION_MARKDOWN_PATH must point to a Markdown file under docs/: $target_file"
              exit 1
              ;;
          esac

          if [[ "$target_file" == */../* || "$target_file" == ../* || "$target_file" == *"/.." ]]; then
            echo "::error::VERSION_MARKDOWN_PATH must not contain path traversal: $target_file"
            exit 1
          fi

          echo "Target file: $target_file"

      - name: Fetch versions and generate markdown
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_jeap_versions.py

      - name: Compare with current markdown
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          
          target_file="${VERSION_MARKDOWN_PATH}"
          
          if [[ -f "$target_file" ]] &&
             cmp -s "generated-jeap-versions.md" "$target_file"; then
            echo "versions_changed=false" >> "$GITHUB_OUTPUT"
            echo "No version changes detected."
          else
            echo "versions_changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changes detected."
          fi

      # Changes to main need a pull request. The jeap-workflows App may bypass that rule, which GITHUB_TOKEN cannot,
      # so the overview is pushed with an App token, limited to this repository and to its contents.
      - name: Create GitHub App token for this repository
        id: repo-token
        if: steps.compare.outputs.versions_changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish markdown
        id: publish
        if: steps.compare.outputs.versions_changed == 'true'
        shell: bash
        env:
          TOKEN: ${{ steps.repo-token.outputs.token }}
        run: |
          set -euo pipefail
          
          target_file="${VERSION_MARKDOWN_PATH}"
          target_branch="${GITHUB_REF_NAME}"
          
          mkdir -p "$(dirname "$target_file")"
          cp -- "generated-jeap-versions.md" "$target_file"
          
          git config user.name "jeap-bot"
          git config user.email "jeap-community@bit.admin.ch"
          
          git add -- "$target_file"
          
          if git diff --cached --quiet; then
            echo "markdown_published=false" >> "$GITHUB_OUTPUT"
            echo "No staged changes after copying generated file."
            exit 0
          fi
          
          git commit \
            --message "chore: Update jEAP versions overview"
          
          # The checkout does not keep credentials, so only the push gets the token.
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${target_branch}"
          echo "markdown_published=true" >> "$GITHUB_OUTPUT"
          
          echo "Markdown published successfully."

      # GITHUB_TOKEN cannot start a workflow in another repository, so the jeap-workflows GitHub App creates a token
      # for this. It is limited to the website repository and to dispatching workflows, and it is revoked when the job
      # ends.
      - name: Create GitHub App token for the website repository
        id: website-token
        if: steps.publish.outputs.markdown_published == 'true' || inputs.force_website_deployment
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: jeap-admin-ch
          repositories: jeap-admin-ch.github.io
          permission-actions: write

      - name: Trigger website deployment
        if: steps.website-token.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.website-token.outputs.token }}
        run: |
          set -euo pipefail

          gh api "repos/jeap-admin-ch/jeap-admin-ch.github.io/actions/workflows/deploy.yml/dispatches" \
            --method POST \
            --field ref=main

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          
          rm -rf -- "_tmp_repos"
          rm -f -- "generated-jeap-versions.md"

  # The workflow runs unattended on a schedule, so a failing run is only noticed if someone is told about it. Same
  # notification as deploy.yml and link-check.yml in jeap-admin-ch.github.io, and like them it needs the secret
  # MS_TEAMS_WEBHOOK.
  notify-ms-teams:
    needs: update-versions
    if: always() && needs.update-versions.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Only to read which step failed.
    permissions:
      actions: read

    steps:
      - name: Notify Microsoft Teams of the failed run
        shell: bash
        env:
          MS_TEAMS_WEBHOOK: ${{ secrets.MS_TEAMS_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [[ -z "${MS_TEAMS_WEBHOOK}" ]]; then
            echo "::warning::MS_TEAMS_WEBHOOK is not configured, no Teams notification sent"
            exit 0
          fi

          # The failed step tells apart e.g. a rejected push from a failed website trigger.
          failed_steps="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .steps[] | select(.conclusion == "failure") | .name] | join(", ")' \
            || true)"

          payload="$(jq -n \
            --arg workflow "${WORKFLOW}" \
            --arg repository "${REPOSITORY}" \
            --arg failedSteps "${failed_steps:-unknown, see the run}" \
            --arg branch "${BRANCH}" \
            --arg event "${EVENT}" \
            --arg actor "${ACTOR}" \
            --arg runId "${RUN_ID}" \
            --arg runUrl "${RUN_URL}" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        text: "GitHub Actions",
                        weight: "Bolder",
                        size: "Medium"
                      },
                      {
                        type: "TextBlock",
                        text: ("🔴 " + $workflow + " • " + $repository),
                        weight: "Bolder",
                        size: "Large",
                        wrap: true
                      },
                      {
                        type: "FactSet",
                        facts: [
                          { title: "Status", value: "🔴 Failed" },
                          { title: "Failed step", value: $failedSteps },
                          { title: "Branch", value: $branch },
                          { title: "Trigger", value: $event },
                          { title: "Triggered by", value: $actor },
                          { title: "Run", value: ("#" + $runId) }
                        ]
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "View GitHub Actions run",
                        url: $runUrl
                      }
                    ]
                  }
                }
              ]
            }')"

          http_code="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data-binary "${payload}" \
            "${MS_TEAMS_WEBHOOK}")"

          if (( http_code < 200 || http_code >= 300 )); then
            echo "::error::Teams notification failed (HTTP status ${http_code})"
            exit 1
          fi
